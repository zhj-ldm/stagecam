name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 类型检查 / 单测 / 构建 / Lint（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npx electron-vite build

      - name: Lint
        run: npm run lint

  smoke-windows:
    name: Windows 启动冒烟
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生产构建
        run: npx electron-vite build

      - name: 启动应用并校验启动标记
        shell: pwsh
        run: |
          $userData = Join-Path $env:APPDATA 'stagecam'
          $marker = Join-Path $userData 'launch-ok.log'
          $errlog = Join-Path $userData 'startup-error.log'
          Remove-Item $marker -ErrorAction SilentlyContinue
          Remove-Item $errlog -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList ".", "--disable-gpu" -PassThru
          Start-Sleep -Seconds 15
          $running = -not $p.HasExited
          Write-Host "process still running: $running"
          if (Test-Path $marker) { Write-Host "marker:"; Get-Content $marker }
          if (Test-Path $errlog) { Write-Host "error log:"; Get-Content $errlog }
          Get-Process electron -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $marker)) {
            Write-Host "::error::应用启动失败或未写出启动标记"
            exit 1
          }

  package-windows:
    name: 打包 Windows 安装包
    runs-on: windows-latest
    needs: verify
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建并打包（NSIS）
        run: npm run dist:win

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: StageCam-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
