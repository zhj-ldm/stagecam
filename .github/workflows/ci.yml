name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 类型检查 / 单测 / 构建 / Lint（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npx electron-vite build

      - name: Lint
        run: npm run lint

  package-windows:
    name: 打包 Windows 安装包
    runs-on: windows-latest
    needs: verify
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建并打包（NSIS）
        run: npm run dist:win

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: StageCam-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
